measures:
  - intent
  - execution
  - voice
  - interaction
auto_score: true
concurrency: 2
max_requests: 96
timeout_seconds: 300
max_characters: 200000
model:
  model: openai/responses/deepseek-flash
  api_base: https://apifusion.aispeech.com.cn/v1
  api_key_env: DEEPSEEK_API_KEY
  args: {reasoning_effort: low, num_retries: 0}
