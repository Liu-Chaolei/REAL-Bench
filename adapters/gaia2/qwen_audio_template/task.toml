schema_version = "1.3"
artifacts = [{ source = "/evaluation/results", service = "are-runner" }]

[metadata]
category = "__CONFIG__"
tags = ["gaia2", "qwen-audio", "official-judge", "audio-input"]
source_id = "__SOURCE_ID__"
scenario_id = "__SCENARIO_ID__"

[agent]
network_mode = "public"
timeout_sec = 3600.0

[environment]
build_timeout_sec = 2400.0
cpus = 2
memory_mb = 4096
storage_mb = 20480

[verifier]
environment_mode = "separate"
timeout_sec = 60.0

[verifier.environment]
network_mode = "no-network"
cpus = 1
memory_mb = 512
storage_mb = 1024
