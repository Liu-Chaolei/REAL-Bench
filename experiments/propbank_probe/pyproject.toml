[project]
name = "tau2-propbank-probe"
version = "0.1.0"
description = "Isolated English PropBank SRL probe for Gaia2-style requests"
requires-python = ">=3.12,<3.14"
dependencies = [
    "hanlp>=2.1.0",
    "pydantic>=2.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3"]

[project.scripts]
propbank-probe = "propbank_probe.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/propbank_probe"]

