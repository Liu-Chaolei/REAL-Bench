domains:
  gaia2:
    revision: gaia2-language-v2
    source: registry
    task_metadata_file: metadata.json
    canonical_scenario: false
    caller: pack
    user_guidelines: Your first utterance is supplied verbatim by the scenario. Afterwards,
      respond naturally to what you actually hear. Repeat or clarify the original
      request, answer using only known facts, and approve actions only when they implement
      that request. Do not invent preferences, change dates or add tasks. If asked
      for unknown information, say you do not know. Wait when the agent is doing requested
      work or monitoring future updates. Do not treat a progress announcement as proof
      of completion. You cannot see future messages, application databases, reference
      answers or evaluation criteria.
    voice_guidelines: ''
    text_guidelines: ''
default_binding: null
voice:
  agent_greeting: Hello! How can I help with your task?
  spellout_section: '## Speaking Special Characters and Numbers

    Spell a name, ID, email, or code character by character only when the agent explicitly
    asks you to spell it. A request to repeat a value or a failed lookup is not a
    request to spell it. Add word anchors or character explanations only when the
    agent specifically asks for anchors or explanations; a spelling request alone
    does not request anchors.


    Only after an explicit spelling request, a spelling-only example is "J, O, H,
    N".

    Only after a specific request for anchors or character explanations, examples
    are ''D as in dog'', ''B as in boy'', ''M as in Mike'', ''K as in kite''.'
  speech_insert_events_per_minute: 1.0
  backchannel_level: medium
